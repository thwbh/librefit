[package]
name = "librefit"
version = "0.1.0"
description = "Your FOSS calorie tracker!"
authors = ["Stefan Poindl"]
license = "GPL-3.0"
repository = "https://github.com/thwbh/librefit"
edition = "2021"
rust-version = "1.84.0"

[workspace]
members = [".", "typegen"]
default-members = ["."]          # bare `cargo build`/`cargo test` + Tauri builds ignore typegen

[workspace.dependencies]
tauri-typegen = "0.5.1"          # single version for build.rs and the typegen crate

[lib]
name = "librefit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }
tauri-typegen = { workspace = true }

[dependencies]
serde_json = "1.0.137"
serde = { version = "1.0.217", features = ["derive"] }
log = "0.4.32"
tauri = { version = "2.11.2", features = ["test"] }
tauri-plugin-log = { version = "2.9.0", features = ["colored"] }
diesel = { version = "2.3.10", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
r2d2 = "0.8"
dotenv = "0.15.0"
chrono = "0.4.45"
validator = { version = "0.21.0", features = ["derive"] }
rust-i18n = "4.1.0"
libmath = "0.2.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-haptics = "2.3.2"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# Bundled Mozilla roots for the provider HTTPS call to avoid Android plumping
rustls = "0.23"
webpki-roots = "0.26"
base64 = "0.22"
little_exif = "0.6.23"
keyring-core = "1"

# satisfy linker for sqlite3 required by diesel
[dependencies.libsqlite3-sys]
version = "0.38.1"
features = [ "bundled" ]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

