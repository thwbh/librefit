name: 'Test'
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop", "deps" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: 'Convention & traceability gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # Populate a node_modules cache keyed on the lockfile so downstream node
      # jobs (svelte-test) can restore it instead of re-running npm ci.
      - name: 'Cache node_modules'
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - name: 'Install Deps'
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # Static gate: ESLint convention rule + scenario-id hygiene + test layout
      # + spec↔test traceability. Runs before the test suites so lint failures
      # fail fast. Does not need the generated TS bindings.
      - name: 'Lint conventions'
        run: npm run lint:conventions
  rust-test:
    name: 'Run nextest'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 'Install Tauri dependencies'
        run: |
          sudo apt update && sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb
      - name: 'Set up Rust'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: 'Cache Rust dependencies'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: 'Install nextest'
        uses: taiki-e/install-action@nextest
      - name: 'Install cargo-llvm-cov'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 'Run tests with coverage'
        run: cd src-tauri/ && cargo llvm-cov nextest --profile ci --lcov --output-path ../coverage-rust.lcov
      - name: 'Upload TypeScript bindings'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-bindings
          path: src/lib/api/gen/
          # The svelte-test job downloads this artifact. Keep it long enough to
          # survive re-runs of that job; with the previous 1-day retention, a
          # re-run >24h after this job completed failed with 'Artifact not
          # found' before vitest could even start.
          retention-days: 7
      - name: 'Upload Rust coverage to Codecov'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-rust.lcov
          flags: rust
          name: rust-coverage
  svelte-test:
    name: 'Run vitest'
    runs-on: ubuntu-latest
    needs: rust-test

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - name: 'Download TypeScript bindings'
      uses: actions/download-artifact@v8
      with:
        name: typescript-bindings
        path: src/lib/api/gen/
    - name: 'Install Node'
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    # Restore the node_modules the lint job built (same lockfile key). Falls
    # back to npm ci only on a cache miss.
    - name: 'Cache node_modules'
      id: node-modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
    - name: 'Install Deps'
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci
    - name: 'Test'
      run: npm run test:ci
    - name: 'Upload Svelte coverage to Codecov'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage-final.json
        flags: svelte
        name: svelte-coverage

  # Android is the only shipping target; compile it on every PR so target-
  # gated dependencies (jni, android-native-keyring-store, ndk-context) and
  # the JNI glue in lib.rs are actually type-checked — the desktop-only jobs
  # never see them. Debug + aarch64 only: validation, not release artifacts.
  android-build:
    name: 'Build Android (aarch64)'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: 'Install frontend dependencies'
        run: npm ci
      - name: 'Set up Rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: 'Cache Rust dependencies'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          shared-key: android-build-ci
      - name: 'Setup Java'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v4
      - name: 'Setup Android NDK'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: true
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: false
      - name: 'Cache Tauri CLI'
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-tauri-cli-2.9.5
      - name: 'Install Tauri CLI'
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "=2.9.5" --locked
          fi
      - name: 'Configure NDK path'
        working-directory: src-tauri/gen/android
        run: echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > local.properties
      - name: 'Build debug APK'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_VERSION: ${{ steps.setup-ndk.outputs.ndk-full-version }}
        run: cargo tauri android build --target aarch64 --apk true --debug
