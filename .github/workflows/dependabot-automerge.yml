name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # Auto-merge only patch/minor updates targeting the deps branch. Majors
      # (e.g. TS 5->6) are left open for manual review, and PRs against other
      # branches (notably main, where a merge triggers a CD release) always
      # require a human. Merge happens once required checks (Test +
      # netrunner-review) are green — GitHub performs the merge, not this job.
      - name: Enable auto-merge (patch/minor, deps only)
        if: (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') && github.event.pull_request.base.ref == 'deps'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
